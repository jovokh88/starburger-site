name: Starburger isolated visual QA
on:
  push:
    branches: [starburger-visual-qa-20260924]
permissions:
  contents: read
concurrency:
  group: starburger-visual-qa
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install and build application
        run: |
          mkdir -p qa-report/framework-guides
          npm ci
          cp node_modules/next/dist/docs/01-app/03-api-reference/03-file-conventions/layout.md qa-report/framework-guides/
          cp node_modules/next/dist/docs/01-app/03-api-reference/02-components/image.md qa-report/framework-guides/
          npm run lint 2>&1 | tee qa-report/lint.txt
          npm run build 2>&1 | tee qa-report/build.txt
          npm ls next react tailwindcss @vercel/analytics > qa-report/versions.txt
      - name: Install isolated browser tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium webkit
      - name: Test local build on desktop and mobile engines
        run: |
          npm run start -- --hostname 127.0.0.1 > qa-report/server.txt 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3000/uz >/dev/null && break; sleep 1; done
          node scripts/visual-qa.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starburger-visual-qa
          path: qa-report/
          retention-days: 2
